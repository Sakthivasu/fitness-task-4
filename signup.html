
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Athletics | Sign Up</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-wrapper {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      background: var(--surface-slate);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 480px;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-void);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent-volt);
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="loader-element"><img class="loader-logo" src="img/logo.webp" alt="Logo"></div>
    <div class="loader-pulse" aria-hidden="true">
      <svg viewBox="0 0 220 44" focusable="false">
        <path class="loader-pulse-line" pathLength="220" d="M2 22h48l10-1 8-8 9 22 10-34 11 22 8-1h28l8-1 9-8 9 16 10-8h28" />
      </svg>
    </div>
    <div class="loader-progress" role="progressbar" aria-label="Page loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loading-progress"></span></div>
    <div class="loader-counter" id="loading-counter">0%</div>
    <div class="loader-text" id="loading-status">PREPARING YOUR ACCOUNT...</div>
  </div>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-container">
        <img class="site-logo" src="img/logo.webp" alt="Logo">
      </a>
      <a href="index.html" class="btn btn-outline" style="background: var(--panel-gray); color: #000;">Back to Home</a>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="display: flex; gap: 1rem; margin-bottom: 2rem; background: var(--bg-void); padding: 0.4rem; border-radius: 30px;">
        <a href="signup.html" class="btn btn-primary" style="flex: 1; justify-content: center; background: var(--dark-pill);">Sign up</a>
        <a href="login.html" class="btn btn-outline" style="flex: 1; justify-content: center; background: transparent; color: var(--text-muted);">Log in</a>
      </div>

      <div id="plan-chip" style="display: none; background: rgba(208, 255, 0, 0.1); border: 1px solid var(--accent-volt); padding: 0.5rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; color: var(--accent-volt); font-size: 0.9rem; font-weight: 600;">
        Selected Plan: <span id="plan-name">Pro</span>
      </div>

      <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Create Your Account</h2>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">Sign up to get started with your fitness journey.</p>
      
      <form id="signup-form" action="dashboard.html">
        <div class="grid-2" style="gap: 1rem;">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" placeholder="First Name" required>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" placeholder="Last Name" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="name@organization.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="At least 8 characters" required>
        </div>
        <div style="margin-bottom: 1.5rem; font-size: 0.9rem;">
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer;">
            <input type="checkbox" required style="accent-color: var(--accent-volt);"> I agree to <a href="dashboard.html#terms" style="color: var(--accent-volt);">Terms & Conditions</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem; background: var(--dark-pill); color: #fff;">Create Account</button>
      </form>
      <p style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="login.html" style="color: var(--accent-volt); font-weight: 600;">Login</a>
      </p>
    </div>
  </div>

  <footer class="auth-footer">
    <div class="auth-footer-brand">
      <img class="site-logo" src="img/logo.webp" alt="Logo">
      <p class="footer-quote">Train with purpose. Build strength for life.</p>
    </div>
    <div class="footer-bottom">
      <p class="footer-copyright">&copy; <span id="footer-year">2026</span> Pulse Athletics. All Rights Reserved.</p>
      <nav class="footer-legal" aria-label="Legal links">
        <a href="dashboard.html#terms">Terms</a>
        <a href="dashboard.html#privacy">Privacy</a>
        <a href="dashboard.html#cookies">Cookies</a>
      </nav>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const plan = urlParams.get('plan');
    if (plan) {
      document.getElementById('plan-chip').style.display = 'block';
      document.getElementById('plan-name').textContent = plan;
    }
  </script>
  <script src="js/main.js"></script>
</body>
</html>
